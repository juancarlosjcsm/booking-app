<div class="container mt-4">
  <!--<button class="btn btn-primary mb-2" [routerLink]="['/events']">Volver</button>-->
    <div *ngIf="event; else noEvent">
      <div class="row">
        <div class="col-md-4">
          <img [src]="event.image" class="img-fluid rounded" alt="{{ event.title }}">
        </div>
    
        <div class="col-md-8">
          <h2 class="d-block d-xl-flex align-items-left w-100">
            {{ event.title }}
            <h3 class="ms-xl-4 text-muted">{{ event.subtitle }}</h3>
          </h2>
          <p class="text-muted d-none d-xl-block" [innerHTML]="event.description"></p>
        </div>
      </div>

      <hr>
  
      <div class="row">
        <div class="col-lg-8 full-height">
          <h3>Sesiones Disponibles</h3>
          <div *ngFor="let session of sessions" class="overflow-auto">
            <div class="card mb-3">
              <div class="card-body p-2">
                <div class="d-flex justify-content-between">
                  <p class="card-text mb-0 d-grid d-sm-flex">
                    <strong>{{ session.date | date : 'dd/MM/yyyy' }}</strong> 
                    <span class="ms-sm-2">Disponibilidad: {{ session.availability }}</span>
                  </p>
                  <p class="card-text mb-0">
                    <button class="btn btn-primary btn-sm me-2 ms-4" [disabled]="!session.selected" (click)="decrementSession(session)">-</button>
                    <span *ngIf="session.selected">{{ session.selected }}</span>
                    <span *ngIf="!session.selected">0</span>
                    <button class="btn btn-primary btn-sm ms-2" [disabled]="session.selected != undefined && session.selected >= session.availability" (click)="incrementSession(session)">+</button>
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-lg-4 d-none d-lg-block">
          <h3>Carrito</h3>
          <app-shoping-cart></app-shoping-cart>
        </div>
      </div>
  
      <button class="cart-button d-md-none" data-bs-toggle="modal" data-bs-target="#cartModal">
        🛒 {{ cartItemCount }}
      </button>
      
      <!-- Modal del Carrito -->
      <div class="modal fade" id="cartModal" tabindex="-1" aria-labelledby="cartModalLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="cartModalLabel">Tu Carrito</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
              <app-shoping-cart></app-shoping-cart>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <ng-template #noEvent>
      <button class="btn btn-primary mb-2" [routerLink]="['/events']">Volver</button>
      <p>EVENT INFO NOT FOUND</p>
    </ng-template>
  </div>
